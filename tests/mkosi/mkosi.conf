# The image the VM tests boot; see tests/mkosi/README.md.
#
# Defused is built from the checkout and installed with `meson install
# --prefix=/usr`, so the image runs the same FHS layout a distribution
# package produces: /usr/bin/fusermount3, /usr/lib/defused/defused, the
# units in /usr/lib/systemd/system and the AppArmor profile in
# /etc/apparmor.d.

[Config]
MinimumVersion=25

[Distribution]
Distribution=ubuntu
Release=resolute
# universe: fuse-overlayfs, apparmor-utils and systemd-repart all live there.
Repositories=main,universe

[Output]
Format=disk
Output=defused
OutputDirectory=mkosi.output
# What run-tests boots, and what Firmware=linux below boots: a direct
# kernel boot skips the firmware and the bootloader entirely.
SplitArtifacts=kernel,initrd

[Content]
# Bootable so that an initrd is built, but with no bootloader: a direct
# kernel boot needs neither a UKI nor systemd-stub.
Bootable=yes
Bootloader=none
# Only reached by booting without systemd.unit=defused-test.service.
Autologin=yes
KernelCommandLine=console=ttyS0

Packages=
        linux-image-virtual
        systemd
        systemd-sysv
        udev
        dbus
        util-linux
        procps
        kmod
        coreutils
        passwd
        python3
        # defused's own runtime dependency.
        libseccomp2
        apparmor
        apparmor-utils
        fuse3
        libfuse2t64
        fuse-overlayfs

BuildPackages=
        gcc
        libc6-dev
        meson
        ninja-build
        pkgconf
        libseccomp-dev
        libfuse-dev

[Build]
CacheDirectory=mkosi.cache
PackageCacheDirectory=mkosi.pkgcache
BuildDirectory=mkosi.builddir
# The checkout, not tests/mkosi: $SRCDIR is the project root.
BuildSources=../..
BuildSourcesEphemeral=yes

[Runtime]
Firmware=linux
Console=native
RuntimeNetwork=none
CPUs=2
RAM=2G
