name: Release

on:
  workflow_dispatch: ~
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: 'system-features = benchmark big-parallel nixos-test uid-range kvm'
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71
        with:
          name: defused
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build .deb and .rpm packages
        run: |
          mkdir -p dist
          deb=$(nix build .#deb --no-link --print-out-paths)
          rpm=$(nix build .#rpm --no-link --print-out-paths)
          cp -L "$deb" "dist/$(basename "$deb").deb"
          cp -L "$rpm" "dist/$(basename "$rpm").rpm"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: packages-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  # Only actually publish a release when this ran off a `v*` tag push --
  # workflow_dispatch (e.g. to smoke-test the build job above) has no such
  # tag to attach a release to.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: dist
          pattern: packages-*
          merge-multiple: true
      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            dist/*
