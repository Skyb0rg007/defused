on:
  workflow_dispatch: ~
  push: ~
  pull_request: ~

permissions:
  contents: read

jobs:
  build-nix:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            system-features: benchmark big-parallel nixos-test uid-range kvm
          - os: ubuntu-24.04-arm
            system-features: benchmark big-parallel nixos-test uid-range
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: 'system-features = ${{ matrix.system-features }}'
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71
        with:
          name: defused
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Run full Nix checks
        if: matrix.os == 'ubuntu-latest'
        run: |
          nix flake check --option keep-going true
      - name: Evaluate flake and build native ARM checks
        if: matrix.os == 'ubuntu-24.04-arm'
        run: |
          nix flake check --no-build
          nix build .#default .#checks.aarch64-linux.reuse-lint
