#
# nfpm (https://nfpm.goreleaser.com) manifest for the .deb/.rpm packages
# built by flake.nix (packages.<system>.deb / packages.<system>.rpm).
#
# `version` and `arch` are filled in from the environment rather than
# hardcoded here, so this file doesn't need to be kept in sync by hand:
#
#   - DEFUSED_VERSION is read out of meson.build's version : '...' by
#     flake.nix, so meson.build stays the single source of truth for the
#     project version.
#   - DEFUSED_ARCH is nfpm's own arch name (amd64/arm64), set by flake.nix
#     from the Nix system it's building for.
#
# This file assumes it is invoked with its working directory set to the root
# of a `meson install --destdir=<destdir> -Dprefix=/usr` tree (see
# flake.nix); every `contents[].src` below is relative to that destdir.
name: "defused"
arch: "${DEFUSED_ARCH}"
platform: "linux"
version: "${DEFUSED_VERSION}"
maintainer: "Skye Soss <skye@soss.website>"
homepage: "https://github.com/Skyb0rg007/defused"
license: "GPL-2.0-or-later"
description: |
  A setuid-less replacement for libfuse's fusermount3 helper.

  Replaces the setuid-root fusermount3 binary with a socket-activated
  system service plus a fusermount3-compatible client, so FUSE mounting
  works under the no_new_privileges process flag.

# Explicit file_info on every entry: the source tree's modes are whatever
# the Nix build happened to produce (e.g. read-only, non-0755 binaries), not
# conventional package modes, so normalize to root:root with the usual
# 0755-executable / 0644-everything-else split rather than passing that
# through as-is.
contents:
  - src: usr/lib/defused/defused
    dst: /usr/lib/defused/defused
    file_info:
      mode: 0755
      owner: root
      group: root
  - src: usr/bin/fusermount3
    dst: /usr/bin/fusermount3
    file_info:
      mode: 0755
      owner: root
      group: root
  - src: usr/share/polkit-1/actions/website.soss.defused.policy
    dst: /usr/share/polkit-1/actions/website.soss.defused.policy
    file_info:
      mode: 0644
      owner: root
      group: root
  - src: usr/lib/systemd/system/defused.service
    dst: /usr/lib/systemd/system/defused.service
    file_info:
      mode: 0644
      owner: root
      group: root
  - src: usr/lib/systemd/system/defused.socket
    dst: /usr/lib/systemd/system/defused.socket
    file_info:
      mode: 0644
      owner: root
      group: root
  - src: usr/share/doc/defused/examples/50-defused-mount-policy.rules
    dst: /usr/share/doc/defused/examples/50-defused-mount-policy.rules
    file_info:
      mode: 0644
      owner: root
      group: root

overrides:
  deb:
    depends:
      - libseccomp2
      - systemd
      - policykit-1
  rpm:
    depends:
      - libseccomp
      - systemd
      - polkit
